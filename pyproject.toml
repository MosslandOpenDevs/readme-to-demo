[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-to-demo"
version = "0.2.0"
description = "Convert raw README markdown into a cleaner demo-oriented brief"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MosslandOpenDevs" }]
keywords = ["readme", "documentation", "markdown", "demo", "cli", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MosslandOpenDevs/readme-to-demo"
Repository = "https://github.com/MosslandOpenDevs/readme-to-demo"
Issues = "https://github.com/MosslandOpenDevs/readme-to-demo/issues"
Changelog = "https://github.com/MosslandOpenDevs/readme-to-demo/blob/main/CHANGELOG.md"

[project.scripts]
readme-to-demo = "readme_to_demo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
