[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-to-demo"
version = "0.1.0"
description = "Convert raw README markdown into a cleaner demo-oriented brief"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MosslandOpenDevs" }]

[project.scripts]
readme-to-demo = "readme_to_demo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
